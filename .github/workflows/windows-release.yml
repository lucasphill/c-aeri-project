name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run tests without hardware access
        run: ./tools/test.ps1
      - name: Build CLI
        run: ./tools/build.ps1
      - name: Build GUI
        run: ./tools/build-gui.ps1
      - name: Locate Inno Setup
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Falha ao instalar Inno Setup.' }
            $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $iscc) { throw 'ISCC.exe nao encontrado.' }
          "ISCC_PATH=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer
        run: ./tools/build-installer.ps1 -Ci -InnoCompiler $env:ISCC_PATH
      - name: Package Windows x64
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          if (-not (Get-ChildItem dist/aeri-Setup-*-x64.exe)) { throw 'Instalador nao encontrado em dist.' }
          Copy-Item build/aeri.exe, build/fanctl.exe, build/PresentMon-LICENSE.txt, build/PresentMon-THIRD-PARTY.txt, build/WebView2-LICENSE.txt, README.md -Destination dist
          Compress-Archive -Path (Get-ChildItem dist -File | Where-Object { $_.Name -notlike 'aeri-Setup-*' }).FullName -DestinationPath aeri-windows-x64.zip
          Move-Item aeri-windows-x64.zip dist/
          Get-ChildItem dist -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf)
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aeri-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          $notes = "Build Windows x64 do commit $env:GITHUB_SHA. Baixe aeri-Setup-*-x64.exe (instalador com inicio automatico), aeri.exe (interface portatil), fanctl.exe (CLI) ou o ZIP portatil com ambos e as licencas. O instalador nao e assinado e vem sem curvas pre-salvas."
          gh release create $tag dist/* --target $env:GITHUB_SHA --title "Windows x64 - $tag" --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release.' }
